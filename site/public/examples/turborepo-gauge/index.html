<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>turborepo.com hero gauge and counter, rebuilt with reanimate</title>
  <meta name="robots" content="noindex">
  <!--
    The hero of turborepo.com: a speedometer whose needle revs toward the red end while the pointer is on it
    and drops back when it leaves, and below it the stats row, whose "compute hours saved" number rolls up
    from the server-rendered figure to the live one once the page has loaded, then ticks up every 10 s.
    The gauge is turborepo.com's own SVG; src/hero.js ports the page's spring (stiffness 520, damping 22)
    and its 1.2 s easeOutCubic counter tween, frame for frame. The live figure is replaced by the one read
    from turborepo.com on 30 Oct 2026 and grows at the rate measured then. Plain HTML + ES modules.
    ?embed: the gauge and the counter alone, for an iframe (the reanimate site shows it this way).
  -->
  <script>if (new URLSearchParams(location.search).has("embed")) document.documentElement.dataset.embed = "";</script>
  <link rel="preload" href="./assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./src/hero.css">
  <script type="module" src="./src/hero.js"></script>
</head>

            </div>
          </div>
        </div>
